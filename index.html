<!DOCTYPE html>
<html>
<head>
    <title>Siktkontroll Utvidelse</title>
    <script src="https://connect-extensions.trimble.com/js/2.0.0/trimble.connect.workspace.api.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f5f5f5; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; }
        input { width: 100%; margin-top: 5px; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; background: #0078d4; color: white; border: none; border-radius: 4px; }
        button:hover { background: #005a9e; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .ok { background: #dff6dd; color: #107c10; }
        .fail { background: #fde7e9; color: #a4262c; }
    </style>
</head>
<body>
    <h3>Siktkontroll v1.0</h3>
    
    <div class="control-group">
        <label>Øyehøyde (meter over bakken):</label>
        <input type="number" id="eyeHeight" value="1.1" step="0.1">
    </div>

    <div class="control-group">
        <label>Objekthøyde (meter over bakken):</label>
        <input type="number" id="objHeight" value="0.5" step="0.1">
    </div>

    <button id="runCheck">Start ny kontroll</button>

    <div id="resultBox" class="result"></div>

    <script src="app.js"></script>
</body>
</html>
